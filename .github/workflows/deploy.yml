name: Deploy Presentations to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor reveal.js (offline assets)
        run: npm run vendor

      - name: Prepare build directory
        run: |
          mkdir -p dist
          cp -r presentations dist/
          cp -r shared dist/

      - name: Build Index Page
        run: npm run build:index

      - name: Expose GitHub Runtime for @actions/cache
        # De runner injecteert ACTIONS_RUNTIME_TOKEN + de cache-URL alleen in
        # JavaScript-actions (`uses:`), niet in `run:`-stappen. Deze stap zet ze
        # in GITHUB_ENV zodat de PDF-export de GitHub-cache kan gebruiken.
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env['ACTIONS_CACHE_SERVICE_V2'] || 'True');

      - name: Generate PDFs via DeckTape (incrementeel, gecached)
        # PDF-export is een nice-to-have: als DeckTape faalt, moeten de slides
        # alsnog gedeployed worden. Daarom blokkeert deze stap de deploy niet.
        # Alleen gewijzigde presentaties worden opnieuw gerenderd; de rest komt
        # uit de GitHub Actions-cache (zie scripts/export-pdf-cached.js).
        continue-on-error: true
        run: npm run export:pdf:cached

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
