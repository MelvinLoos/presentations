name: Deploy Presentations to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor reveal.js (offline assets)
        run: npm run vendor

      - name: Prepare build directory
        run: |
          mkdir -p dist
          cp -r presentations dist/
          cp -r shared dist/

      - name: Build Index Page
        run: npm run build:index

      - name: Generate PDFs via DeckTape (Docker)
        # PDF-export is een nice-to-have: als DeckTape faalt, moeten de slides
        # alsnog gedeployed worden. Daarom blokkeert deze stap de deploy niet.
        continue-on-error: true
        run: |
          # Mount de hele dist-map: de decks verwijzen relatief naar shared/
          # (../../../../../shared/...), dus de root moet binnen de container kloppen.
          failures=0
          while read -r presentation; do
            rel="${presentation#dist/}"
            rel="${rel%/index.html}"
            echo "Genereren PDF voor: $rel"
            if docker run --rm -v "$(pwd)/dist:/slides" astefanutti/decktape \
                 --size 1920x1080 "/slides/$rel/index.html" "/slides/$rel/presentation.pdf"; then
              echo "✔ PDF gegenereerd: $rel/presentation.pdf"
            else
              echo "⚠️ PDF genereren mislukt voor: $rel (deploy gaat door)"
              failures=$((failures + 1))
            fi
          done < <(find dist/presentations -name "index.html" | sort)
          echo "PDF-export afgerond: ${failures} presentatie(s) mislukt."
          [ "$failures" -eq 0 ]

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
