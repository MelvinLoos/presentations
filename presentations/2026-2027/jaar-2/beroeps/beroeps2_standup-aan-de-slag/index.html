<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand-up &amp; aan de slag — GLR CSD</title>
<meta name="description" content="Korte werkles voor BEROEPS2: bij binnenkomst klaarzitten, een daily stand-up van vijf minuten per team en daarna een reminder-slide met de werkafspraken (één taak per persoon, geen gamen, geen telefoons).">
<meta name="author" content="Docententeam CSD">

<link rel="stylesheet" href="../../../../../shared/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../../../../shared/vendor/reveal/plugin/highlight/monokai.css">
<link rel="stylesheet" href="../../../../../shared/css/glr-theme.css">
<style>
  /* Presentatiespecifieke bouwstenen (niet in het gedeelde thema). */

  /* Donkere slides */
  .dark .defbox{background:#1C1C1C}
  .dark .defbox .k{color:var(--lime)}
  .dark .check li{color:#E4E4E4}

  /* Werkafspraken: vier grote tegels, leesbaar vanaf achter in het lokaal */
  .rules{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px}
  .rule{background:#1C1C1C;border-top:8px solid var(--lime);border-radius:6px;padding:30px 24px;min-height:300px}
  .rule .k{display:block;font-family:'Space Grotesk',sans-serif;font-size:16px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--lime);margin-bottom:12px}
  .rule h3{font-size:34px;line-height:1.15;color:var(--white);margin-bottom:12px}
  .reveal .rule p{font-size:22px;line-height:1.3;color:#C9C9C9}
  .rule--alert{border-top-color:#E0563F}
  .rule--alert .k{color:#FF8A75}
</style>
</head>
<body>

<div class="reveal">
  <div class="slides">
    <!--
      De scheidingstekens eisen een lege regel voor en na de marker. Daardoor
      wordt het YAML-frontmatter-blok bovenin slides.md (zonder lege regel rond
      de markers) niet als slide opgevat. Die frontmatter is metadata voor de
      portaalpagina (scripts/build-index.js); de marker erin verbergt de sectie.
    -->
    <section
      data-markdown="slides.md"
      data-separator="\n---\n\n"
      data-separator-vertical="\n--\n\n"
      data-separator-notes="^Note:"
      data-charset="utf-8"></section>
  </div>
</div>

<script src="../../../../../shared/vendor/reveal/reveal.js"></script>
<script src="../../../../../shared/vendor/reveal/plugin/markdown/markdown.js"></script>
<script src="../../../../../shared/vendor/reveal/plugin/highlight/highlight.js"></script>
<script src="../../../../../shared/vendor/reveal/plugin/notes/notes.js"></script>
<script src="../../../../../shared/vendor/reveal/plugin/search/search.js"></script>
<script src="../../../../../shared/vendor/reveal/plugin/zoom/zoom.js"></script>
<script src="../../../../../shared/js/glr-plugins.js"></script>

<script>
  Reveal.initialize({
    width: 1280,
    height: 720,
    margin: 0,
    display: 'flex',          /* slides zijn flex-kolommen (huisstijl-layout) */
    center: false,
    minScale: 0.2,
    maxScale: 1.6,
    hash: true,
    progress: true,
    controlsLayout: 'bottom-right',
    slideNumber: false,       /* eigen paginanummer in de footer */
    transition: 'slide',
    backgroundTransition: 'fade',
    plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealSearch, RevealZoom],
    markdown: { smartypants: true }
  }).then(function () {
    /* De markdown-plugin rendert de slides pas na DOMContentLoaded;
       daarom de GLR-componenten (timers) hier opnieuw initialiseren. */
    GLRPlugins.initAll();
  });
</script>

</body>
</html>
